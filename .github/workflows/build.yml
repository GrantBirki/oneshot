name: build

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
        with:
          persist-credentials: false

      - name: bootstrap
        run: script/bootstrap

      - name: build
        run: script/build

      - name: package
        run: SKIP_UPDATE=1 script/package

      - name: verify package
        run: script/verify-package
