name: release

on:
  push:
    branches:
      - main
    paths:
      - "VERSION"

permissions: {}

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'GrantBirki/oneshot' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.workflow_sha == github.sha
    permissions:
      contents: read
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.upload-artifact.outputs.artifact-id }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: verify checkout
        run: |
          actual_sha=$(git rev-parse HEAD)
          if [[ "$actual_sha" != "$GITHUB_SHA" ]]; then
            echo "Checkout mismatch: expected $GITHUB_SHA but got $actual_sha"
            exit 1
          fi

      - name: read version
        id: version
        run: |
          version=$(awk 'NF && $1 !~ /^#/ {print $1; exit}' VERSION)
          if [[ -z "$version" ]]; then
            echo "VERSION file is empty."
            exit 1
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must be in X.Y.Z format; got ${version}."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: bootstrap
        run: script/bootstrap

      - name: test
        run: script/test

      - name: package
        env:
          GIT_SHA: ${{ github.sha }}
        run: script/package

      - name: verify package
        env:
          EXPECTED_GIT_SHA: ${{ github.sha }}
        run: script/verify-package

      - name: scan artifact for tokens
        run: |
          artifact="dist/OneShot.zip"
          if [[ ! -f "$artifact" ]]; then
            echo "Expected artifact not found at $artifact"
            exit 1
          fi

          scan_dir="$(mktemp -d)"
          trap 'rm -rf "$scan_dir"' EXIT
          ditto -x -k "$artifact" "$scan_dir"

          if grep -R -a -E -n 'gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}' "$scan_dir" >/dev/null; then
            echo "Potential token found in release artifact (file paths only):"
            grep -R -a -E -l 'gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}' "$scan_dir"
            exit 1
          fi

      - name: upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pin@v7.0.1
        id: upload-artifact
        with:
          name: unnotarized-dist
          path: dist/
          retention-days: 5
          if-no-files-found: error

  finalize:
    needs: build
    environment: release
    permissions: {}
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.upload-artifact.outputs.artifact-id }}

    steps:
      - name: download unnotarized artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # pin@v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: "input/"

      - name: verify unnotarized artifact
        env:
          EXPECTED_GIT_SHA: ${{ github.sha }}
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail

          input_zip="input/OneShot.zip"
          input_checksum="${input_zip}.sha256"
          if [[ ! -f "$input_zip" || ! -f "$input_checksum" ]]; then
            echo "Unnotarized app archive or checksum is missing."
            exit 1
          fi

          expected_input_sha=$(awk 'NF {print $1; exit}' "$input_checksum")
          actual_input_sha=$(shasum -a 256 "$input_zip" | awk '{print $1}')
          if [[ ! "$expected_input_sha" =~ ^[0-9a-fA-F]{64}$ || "$actual_input_sha" != "$expected_input_sha" ]]; then
            echo "Unnotarized app archive checksum mismatch."
            exit 1
          fi

          staging_dir="$RUNNER_TEMP/oneshot-finalize"
          rm -rf "$staging_dir"
          mkdir -p "$staging_dir"
          ditto -x -k "$input_zip" "$staging_dir"

          app_path="$staging_dir/OneShot.app"
          top_level_count=$(find "$staging_dir" -mindepth 1 -maxdepth 1 -print | wc -l | tr -d ' ')
          if [[ "$top_level_count" != "1" || ! -d "$app_path" ]]; then
            echo "Archive must contain exactly one top-level OneShot.app bundle."
            exit 1
          fi

          codesign --verify --deep --strict "$app_path"
          signature_details=$(codesign -d --verbose=4 "$app_path" 2>&1)
          if [[ "$signature_details" != *"flags="*"runtime"* ]]; then
            echo "Application signature must enable the hardened runtime."
            exit 1
          fi

          entitlements=$(codesign -d --entitlements :- "$app_path" 2>/dev/null || true)
          if [[ "$entitlements" == *"com.apple.security.get-task-allow"* ]]; then
            echo "Release application must not contain get-task-allow."
            exit 1
          fi

          plist_path="$app_path/Contents/Info.plist"
          bundle_identifier=$(plutil -extract CFBundleIdentifier raw -o - "$plist_path")
          short_version=$(plutil -extract CFBundleShortVersionString raw -o - "$plist_path")
          build_version=$(plutil -extract CFBundleVersion raw -o - "$plist_path")
          git_sha=$(plutil -extract GIT_SHA raw -o - "$plist_path")
          if [[ "$bundle_identifier" != "com.grantbirki.oneshot" ]]; then
            echo "Unexpected bundle identifier: $bundle_identifier"
            exit 1
          fi
          if [[ "$short_version" != "$EXPECTED_VERSION" || "$build_version" != "$EXPECTED_VERSION" ]]; then
            echo "Application version does not match the release version."
            exit 1
          fi
          if [[ "$git_sha" != "$EXPECTED_GIT_SHA" ]]; then
            echo "Application commit does not match the release commit."
            exit 1
          fi

      - name: sign + notarize
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077

          for variable in \
            APPLE_DEVELOPER_ID_P12_BASE64 \
            APPLE_DEVELOPER_ID_P12_PASSWORD \
            APPLE_NOTARY_KEY_P8_BASE64 \
            APPLE_NOTARY_KEY_ID \
            APPLE_NOTARY_ISSUER_ID \
            APPLE_TEAM_ID; do
            if [[ -z "${!variable:-}" ]]; then
              echo "${variable} is not configured."
              exit 1
            fi
          done

          if [[ ! "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "APPLE_TEAM_ID must be a 10-character identifier."
            exit 1
          fi
          if [[ ! "$APPLE_NOTARY_KEY_ID" =~ ^[A-Z0-9]{10,}$ ]]; then
            echo "APPLE_NOTARY_KEY_ID must be an identifier of at least 10 characters."
            exit 1
          fi
          if [[ ! "$APPLE_NOTARY_ISSUER_ID" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
            echo "APPLE_NOTARY_ISSUER_ID must be a UUID."
            exit 1
          fi

          app_path="$RUNNER_TEMP/oneshot-finalize/OneShot.app"
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          notary_key_path="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          keychain_path="$RUNNER_TEMP/oneshot-signing.keychain-db"
          notary_zip="$RUNNER_TEMP/OneShot-notary.zip"
          notary_result="$RUNNER_TEMP/notary-result.json"
          notary_log="$RUNNER_TEMP/notary-log.json"
          dist_dir="$GITHUB_WORKSPACE/dist"

          cleanup() {
            security delete-keychain "$keychain_path" >/dev/null 2>&1 || true
            rm -f \
              "$certificate_path" \
              "$notary_key_path" \
              "$notary_zip" \
              "$notary_result" \
              "$notary_log"
            rm -rf "$RUNNER_TEMP/oneshot-finalize"
          }
          trap cleanup EXIT

          if [[ ! -d "$app_path" ]]; then
            echo "Validated application is missing."
            exit 1
          fi

          printf '%s' "$APPLE_DEVELOPER_ID_P12_BASE64" | /usr/bin/base64 --decode > "$certificate_path"
          printf '%s' "$APPLE_NOTARY_KEY_P8_BASE64" | /usr/bin/base64 --decode > "$notary_key_path"
          if [[ ! -s "$certificate_path" || ! -s "$notary_key_path" ]]; then
            echo "Decoded Apple credential files must not be empty."
            exit 1
          fi
          if ! grep -Fq -- "-----BEGIN PRIVATE KEY-----" "$notary_key_path"; then
            echo "Decoded notarization key is not an App Store Connect private key."
            exit 1
          fi

          keychain_password=$(/usr/bin/openssl rand -hex 32)
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 1800 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$keychain_password" \
            "$keychain_path" >/dev/null

          identity_hashes=$(security find-identity -v -p codesigning "$keychain_path" |
            awk -v team="$APPLE_TEAM_ID" '$0 ~ /Developer ID Application:/ && index($0, "(" team ")") { print $2 }')
          identity_count=$(printf '%s\n' "$identity_hashes" | awk 'NF { count++ } END { print count + 0 }')
          if [[ "$identity_count" != "1" ]]; then
            echo "Expected exactly one Developer ID Application identity for APPLE_TEAM_ID."
            exit 1
          fi
          identity_hash=$(printf '%s\n' "$identity_hashes" | awk 'NF { print; exit }')

          codesign \
            --force \
            --options runtime \
            --timestamp \
            --keychain "$keychain_path" \
            --sign "$identity_hash" \
            "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"

          signature_details=$(codesign -d --verbose=4 "$app_path" 2>&1)
          if [[ "$signature_details" != *"Authority=Developer ID Application:"* ]]; then
            echo "Application is not signed with a Developer ID Application certificate."
            exit 1
          fi
          if [[ "$signature_details" != *"flags="*"runtime"* ]]; then
            echo "Developer ID signature must enable the hardened runtime."
            exit 1
          fi
          if [[ "$signature_details" != *"TeamIdentifier=$APPLE_TEAM_ID"* ]]; then
            echo "Application signature does not match APPLE_TEAM_ID."
            exit 1
          fi
          if [[ "$signature_details" != *"Timestamp="* ]]; then
            echo "Application signature does not contain a secure timestamp."
            exit 1
          fi

          entitlements=$(codesign -d --entitlements :- "$app_path" 2>/dev/null || true)
          if [[ "$entitlements" == *"com.apple.security.get-task-allow"* ]]; then
            echo "Release application must not contain get-task-allow."
            exit 1
          fi

          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$notary_zip"

          submit_status=0
          xcrun notarytool submit "$notary_zip" \
            --key "$notary_key_path" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait \
            --output-format json > "$notary_result" || submit_status=$?

          submission_id=$(plutil -extract id raw -o - "$notary_result" 2>/dev/null || true)
          notarization_status=$(plutil -extract status raw -o - "$notary_result" 2>/dev/null || true)
          if [[ -n "$submission_id" ]]; then
            log_status=0
            xcrun notarytool log "$submission_id" \
              --key "$notary_key_path" \
              --key-id "$APPLE_NOTARY_KEY_ID" \
              --issuer "$APPLE_NOTARY_ISSUER_ID" \
              "$notary_log" || log_status=$?
            if [[ -s "$notary_log" ]]; then
              cat "$notary_log"
            fi
          else
            log_status=1
          fi

          if [[ "$submit_status" -ne 0 || "$notarization_status" != "Accepted" ]]; then
            echo "Apple notarization was not accepted."
            cat "$notary_result"
            exit 1
          fi
          if [[ "$log_status" -ne 0 || ! -s "$notary_log" ]]; then
            echo "Unable to retrieve the Apple notarization log."
            exit 1
          fi

          xcrun stapler staple "$app_path"
          xcrun stapler validate "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"

          rm -rf "$dist_dir"
          mkdir -p "$dist_dir"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$dist_dir/OneShot.zip"
          shasum -a 256 "$dist_dir/OneShot.zip" | awk '{print $1}' > "$dist_dir/OneShot.zip.sha256"

      - name: scan finalized artifact for tokens
        run: |
          scan_dir="$(mktemp -d)"
          trap 'rm -rf "$scan_dir"' EXIT
          ditto -x -k dist/OneShot.zip "$scan_dir"

          if grep -R -a -E -n 'gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}' "$scan_dir" >/dev/null; then
            echo "Potential token found in finalized release artifact (file paths only):"
            grep -R -a -E -l 'gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}' "$scan_dir"
            exit 1
          fi

      - name: upload finalized artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pin@v7.0.1
        id: upload-artifact
        with:
          name: dist
          path: dist/
          retention-days: 5
          if-no-files-found: error

  attest:
    needs: [build, finalize]
    environment: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      bundle_artifact_id: ${{ steps.upload_bundle.outputs.artifact-id }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: fence
        uses: openai/fence@e6b39c80c51cb2b2a39448ddeff74b3b886c0a63 # pin@v0.10.0
        with:
          allow_github_artifacts: true
          allowlist: |
            fulcio.sigstore.dev
            rekor.sigstore.dev

      - name: download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # pin@v8.0.1
        with:
          artifact-ids: ${{ needs.finalize.outputs.artifact-id }}
          path: "dist/"

      - name: attest build provenance
        id: attest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # pin@v4.2.0
        with:
          subject-path: "dist/OneShot.zip"

      - name: upload attestation bundle
        id: upload_bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pin@v7.0.1
        with:
          name: attestation-bundle
          path: ${{ steps.attest.outputs.bundle-path }}
          retention-days: 5
          if-no-files-found: error

  verify:
    needs: [build, finalize, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: fence
        uses: openai/fence@e6b39c80c51cb2b2a39448ddeff74b3b886c0a63 # pin@v0.10.0
        with:
          allow_github_artifacts: true
          allowlist: |
            tuf-repo-cdn.sigstore.dev
            tuf-repo.github.com

      - name: download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # pin@v8.0.1
        with:
          artifact-ids: ${{ needs.finalize.outputs.artifact-id }}
          path: "dist/"

      - name: download attestation bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # pin@v8.0.1
        with:
          artifact-ids: ${{ needs.attest.outputs.bundle_artifact_id }}
          path: "attestation/"

      - name: verify
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          ARTIFACT_PATH: "dist/OneShot.zip"
          BUNDLE_DIR: "attestation"
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_DIGEST: ${{ github.sha }}
        run: |
          if [[ ! -f "$ARTIFACT_PATH" ]]; then
            echo "Expected artifact not found at $ARTIFACT_PATH"
            exit 1
          fi

          if [[ ! -f "${ARTIFACT_PATH}.sha256" ]]; then
            echo "Expected checksum not found at ${ARTIFACT_PATH}.sha256"
            exit 1
          fi

          expected_sha=$(cat "${ARTIFACT_PATH}.sha256")
          actual_sha=$(sha256sum "$ARTIFACT_PATH" | awk '{print $1}')
          if [[ "$expected_sha" != "$actual_sha" ]]; then
            echo "Checksum mismatch: expected $expected_sha but got $actual_sha"
            exit 1
          fi

          mapfile -d '' bundle_files < <(find "$BUNDLE_DIR" -type f -print0)
          if [[ "${#bundle_files[@]}" -ne 1 ]]; then
            echo "Expected exactly one attestation bundle, found ${#bundle_files[@]}."
            exit 1
          fi
          bundle_path="${bundle_files[0]}"

          gh attestation verify "$ARTIFACT_PATH" \
            --bundle "$bundle_path" \
            --repo "${OWNER}/${REPO}" \
            --signer-workflow "${OWNER}/${REPO}/.github/workflows/release.yml" \
            --signer-digest "$SOURCE_DIGEST" \
            --source-ref "$SOURCE_REF" \
            --source-digest "$SOURCE_DIGEST" \
            --deny-self-hosted-runners

  release:
    needs: [build, finalize, verify]
    environment: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: fence
        uses: openai/fence@e6b39c80c51cb2b2a39448ddeff74b3b886c0a63 # pin@v0.10.0
        with:
          allow_github_artifacts: true
          allowlist: |
            uploads.github.com

      - name: download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # pin@v8.0.1
        with:
          artifact-ids: ${{ needs.finalize.outputs.artifact-id }}
          path: "dist/"

      - name: ensure tag does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set +e
          tag_lookup=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" 2>&1)
          tag_lookup_status=$?
          set -e

          if [[ "$tag_lookup_status" -eq 0 ]]; then
            echo "Tag already exists: ${TAG}"
            exit 1
          fi

          if [[ "$tag_lookup" != *"HTTP 404"* ]]; then
            echo "Unable to confirm that tag ${TAG} does not exist."
            printf '%s\n' "$tag_lookup"
            exit 1
          fi

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          gh release create "$TAG" \
            "dist/OneShot.zip" \
            "dist/OneShot.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes

  release_info:
    needs: [build, finalize, release]
    if: ${{ always() && needs.build.result == 'success' && needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: fence
        uses: openai/fence@e6b39c80c51cb2b2a39448ddeff74b3b886c0a63 # pin@v0.10.0
        with:
          allow_github_artifacts: true

      - name: download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # pin@v8.0.1
        with:
          artifact-ids: ${{ needs.finalize.outputs.artifact-id }}
          path: "dist/"

      - name: print tap update info
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          sha_file="dist/OneShot.zip.sha256"
          if [[ ! -f "$sha_file" ]]; then
            echo "Release info unavailable: expected checksum not found at $sha_file"
            exit 0
          fi

          sha=$(cat "$sha_file")
          if [[ ! "$sha" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "Release info unavailable: invalid SHA256 in $sha_file"
            exit 0
          fi

          green='\033[0;32m'
          blue='\033[0;34m'
          yellow='\033[0;33m'
          off='\033[0m'

          echo -e "${green}Homebrew tap update details:${off}"
          echo -e "  ${blue}version${off}: ${VERSION}"
          echo -e "  ${blue}sha256${off}: ${sha}"
          echo
          echo -e "${yellow}Cask snippet:${off}"
          cat <<RUBY
          cask "oneshot" do
            version "${VERSION}"
            sha256 "${sha}"

            url "https://github.com/grantbirki/oneshot/releases/download/v#{version}/OneShot.zip"
            name "OneShot"
            desc "Open source screenshot utility"
            homepage "https://github.com/grantbirki/oneshot"

            livecheck do
              url :url
              strategy :github_latest
            end

            depends_on macos: ">= :tahoe"

            app "OneShot.app"

            zap trash: [
              "~/Library/Preferences/com.grantbirki.oneshot.plist",
              "~/Library/Saved Application State/com.grantbirki.oneshot.savedState",
            ]
          end
          RUBY
